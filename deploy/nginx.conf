# Nginx config for Makeup by Roopal Goel
# Place at: /etc/nginx/sites-available/roopal
# Then: ln -s /etc/nginx/sites-available/roopal /etc/nginx/sites-enabled/

# Replace YOUR_DOMAIN with your actual domain (e.g., makeupbyroopalgoel.com)
# Replace /var/www/roopal with your actual deployment path

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Upload size limit (must match server's 100MB)
    client_max_body_size 100M;

    # Main reverse proxy to Node.js
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static uploads — served directly by Nginx for performance
    location /uploads/ {
        alias /var/www/roopal/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
